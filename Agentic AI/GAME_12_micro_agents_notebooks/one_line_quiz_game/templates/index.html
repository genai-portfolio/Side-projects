<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><title>{{ game.goals.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <div><h1>{{ game.goals.title }}</h1><p class="subtitle">{{ game.goals.subtitle }}</p></div>
    <div class="badge">GAME · Goals · Actions · Memory · Environment</div>
  </header>
  <main class="layout">
    <section class="panel panel-main">
      <div class="topic-tabs" id="topic-tabs"></div>
      <div id="question-card" class="question-card hidden">
        <p class="q-label">Question</p>
        <p id="q-text" class="q-text"></p>
        <form id="answer-form" class="answer-form">
          <input id="answer-input" type="text" placeholder="Your one-line answer…" autocomplete="off"/>
          <div class="confidence-row">
            <label>Confidence:</label>
            <div class="confidence-btns" id="conf-btns"></div>
          </div>
          <button class="btn btn-primary" type="submit">Submit Answer</button>
        </form>
        <p id="answer-feedback" class="answer-feedback"></p>
      </div>
    </section>
    <section class="panel panel-side">
      <div class="goals-card"><h2>Goals & Rules</h2><ul>{% for r in game.goals.rules %}<li>{{ r }}</li>{% endfor %}</ul></div>
      <div class="stats-card"><h2>Stats</h2><div id="stats-summary" class="stats-summary"></div></div>
      <div class="logs-card"><h2>Recent Attempts</h2><div id="recent-logs" class="recent-logs"></div></div>
    </section>
  </main>
</div>
<script>window.__INITIAL_GAME__ = {{ game | tojson }};</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
