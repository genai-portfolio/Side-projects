<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><title>{{ game.goals.title }}</title><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/></head>
<body><div class="app-shell">
<header class="app-header"><div><h1>{{ game.goals.title }}</h1><p class="subtitle">{{ game.goals.subtitle }}</p></div><div class="badge">GAME · Goals · Actions · Memory · Environment</div></header>
<main class="layout">
  <section class="panel panel-main">
    <div class="split-pane">
      <div class="pane-left"><h2>Raw Notes</h2><textarea id="raw-input" placeholder="Paste your messy notes here…"></textarea><button id="clean-btn" class="btn btn-primary">Clean Notes ✨</button><p id="feedback" class="feedback"></p></div>
      <div class="pane-right"><h2>Cleaned Markdown</h2><pre id="clean-output" class="clean-output">Your cleaned notes will appear here…</pre><button id="download-btn" class="btn btn-ghost" disabled>Download .md</button></div>
    </div>
  </section>
  <section class="panel panel-side">
    <div class="goals-card"><h2>Rules</h2><ul>{% for r in game.goals.rules %}<li>{{ r }}</li>{% endfor %}</ul></div>
    <div class="stats-card"><h2>Stats</h2><div id="stats" class="stats-summary"></div></div>
  </section>
</main></div>
<script>window.__INITIAL_GAME__={{ game | tojson }};</script><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
